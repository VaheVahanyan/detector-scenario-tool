[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "detector-scenario-tool"
version = "0.0.0"
description = "Desktop UI tool for detector scenario authoring"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7,<7",
]

[project.optional-dependencies]
# Live serial capture of detector debug logs.
serial = [
  "pyserial>=3.5",
]
# Live CAN transport via a CANable adapter (SocketCAN or slcan).
can = [
  "python-can>=4.3",
]
dev = [
  "pytest>=8.0",
  "pytest-qt>=4.4",
]

[project.scripts]
detector-scenario-tool = "detector_scenario_tool.app.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Qt is forced offscreen in tests/conftest.py, before PySide6 is imported.
markers = [
  "protocol_v2: expectation taken from Протокол_CAN_ГС_v2; see docs/UPGRADE_PLAN.md phase 1",
]
