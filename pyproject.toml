[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "detector-scenario-tool"
version = "0.0.0"
description = "Desktop UI tool for detector scenario authoring"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7,<7",
]

[project.scripts]
detector-scenario-tool = "detector_scenario_tool.app.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]